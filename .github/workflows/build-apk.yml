name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Check ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Raw Java Version Output: $JAVA_VER_OUTPUT"

          JAVA_MAJOR=$(echo "$JAVA_VER_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect active Java major version from '$JAVA_VER_OUTPUT'." >&2
            exit 1
          fi

          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17." >&2
            exit 1
          fi
          echo "Java environment verified successfully: version $JAVA_MAJOR >= 17."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Reusing existing debug keystore."
          else
            echo "./debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore." >&2
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying Debug APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at: $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk for any APK files:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is empty (size is 0 bytes)." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not have the .apk extension." >&2
              exit 1
              ;;
          esac

          echo "APK successfully verified: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO_NAME" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          RELEASE_FILEPATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp -v "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_FILEPATH"

          if [ ! -f "$RELEASE_FILEPATH" ] || [ ! -s "$RELEASE_FILEPATH" ]; then
            echo "ERROR: Failed to prepare release asset at $RELEASE_FILEPATH" >&2
            exit 1
          fi

          echo "Prepared release asset: $RELEASE_FILEPATH"
          echo "asset_path=${RELEASE_FILEPATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG_NAME="${{ steps.prepare_asset.outputs.tag_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty at $ASSET_PATH." >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH" >&2
              exit 1
              ;;
          esac

          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES="### Automatic Debug APK Build

This is an automatically generated debug APK built by GitHub Actions.

- **Build Run Number:** ${{ github.run_number }}
- **Build Run Attempt:** ${{ github.run_attempt }}
- **Source Commit:** \`${{ github.sha }}\`
- **Asset Filename:** \`${ASSET_NAME}\`

> **Note:** This APK is intended for testing and evaluation purposes. It is not a production release for the Google Play Store and is signed only with a temporary debug keystore."

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Reporting Build & Release Outcome ==="
          TAG_NAME="${{ steps.prepare_asset.outputs.tag_name }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$TAG_NAME" || true
            RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            {
              echo "## :rocket: Debug APK Published to GitHub Releases"
              echo ""
              echo "- **Release:** [$TAG_NAME]($RELEASE_URL)"
              echo "- **Direct Download:** Download \`$ASSET_NAME\` directly from the **Assets** section on the release page."
              echo "- **Actions Artifact Backup:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available under this workflow run's Summary tab."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed. The debug APK build succeeded and the artifact was safely uploaded."

            {
              echo "## :warning: Debug APK Build Succeeded (Release Publishing Notice)"
              echo ""
              echo "The debug APK was built successfully and is preserved as a GitHub Actions artifact."
              echo "- **Actions Artifact:** Download \`app-debug-apk\` from the Artifacts section on this workflow run summary page."
              echo "- **Note:** GitHub Release publication could not be completed (e.g. repository permissions or release limits), but the build artifact is fully intact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
